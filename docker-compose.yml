version: '3.8'

services:
  api:
    build: .
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: python -m celery -A src.tasks.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - api